name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Backend lint & tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test tools
        run: python -m pip install pytest ruff==0.16.10 pyyaml==6.0.2

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          ORDER_API_DB_PATH: /tmp/su-order-api/orders.db
          ORDER_API_SLIPS_DIR: /tmp/su-order-api/slips
        run: python -m pytest tests/ -v
