name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Image SHA to deploy (leave empty to build the current revision)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: su-store-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Backend lint & tests
    if: inputs.sha == ''
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test tools
        run: python -m pip install pytest ruff==0.16.10 pyyaml==6.0.2

      - name: Lint
        run: ruff check .

      - name: Test
        env:
          ORDER_API_DB_PATH: /tmp/su-order-api/orders.db
          ORDER_API_SLIPS_DIR: /tmp/su-order-api/slips
        run: python -m pytest tests/ -v

  image:
    needs: test
    if: inputs.sha == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/weerapong-gui/su-store-server:${{ github.sha }}
            ghcr.io/weerapong-gui/su-store-server:main

  deploy:
    needs: [image]
    if: always() && vars.DEPLOY_ENABLED == 'true' && (needs.image.result == 'success' || inputs.sha != '')
    runs-on: [self-hosted, su-store]
    environment: production
    permissions:
      contents: read
    env:
      DEPLOY_SHA: ${{ inputs.sha || github.sha }}
    steps:
      - name: Check out deployment revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Install backend deployment files
        shell: bash
        run: |
          install -d "${SU_STORE_DIR:?}/backend/ops"
          cp compose.yml "${SU_STORE_DIR}/backend/compose.yml"
          # The whole ops/ tree: the frontend deploy, the backup timer and the migration use it too.
          cp -R ops/. "${SU_STORE_DIR}/backend/ops/"

      - name: Deploy backend image
        run: '"${SU_STORE_DIR:?}/backend/ops/deploy-service.sh" backend "$DEPLOY_SHA"'
