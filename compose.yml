# The daily backup runs from a systemd timer on the host (ops/systemd/), not as a service here.
services:
  su-store-api:
    image: ghcr.io/weerapong-gui/su-store-server:${API_IMAGE_TAG:?}
    container_name: su-store-api
    restart: unless-stopped
    environment:
      ORDER_API_HOST: 0.0.0.0
      ORDER_API_PORT: "10000"
      ORDER_API_DB_PATH: /var/data/su-order-api/orders.db
      ORDER_API_SLIPS_DIR: /var/data/su-order-api/slips
      ORDER_API_TOKEN: ${ORDER_API_TOKEN:?}
      PICKUP_USERNAME: ${PICKUP_USERNAME:-staff}
      PICKUP_PASSWORD: ${PICKUP_PASSWORD:-}
      ORDER_API_WORKERS: ${ORDER_API_WORKERS:-1}
    volumes:
      - ${SU_STORE_DATA_DIR:?}/order-api:/var/data
    ulimits:
      nofile: 65536
    networks:
      - su-store-net
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Tunnel for sumfu.store (token-managed: hostnames are set in the Cloudflare dashboard).
  # Not restarted by deploy-service.sh; start it once with `docker compose up -d su-store-cloudflared`.
  su-store-cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    container_name: su-store-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 127.0.0.1:2000 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    networks:
      - su-store-net
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:2000", "ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  su-store-net:
    external: true
