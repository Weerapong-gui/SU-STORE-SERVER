# One lint config for local runs and CI (`ruff check .`).
target-version = "py311"
line-length = 120

[lint]
# pyflakes/pycodestyle errors, import order, modern syntax, likely bugs, simplifications,
# ruff's own checks, and naive-datetime use (the shop runs on Bangkok time).
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "DTZ"]
# Thai UI strings legitimately contain characters ruff calls "ambiguous".
ignore = ["RUF001", "RUF002", "RUF003"]
