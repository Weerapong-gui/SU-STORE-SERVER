<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SU STORE — Display</title>
<style>
@font-face {
  font-family: 'SukhumvitSet';
  src: url('/fonts/SukhumvitSet.ttc') format('truetype');
  font-weight: 100 900;
  font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #ffffff;
  --surface: #f1f5f9;
  --border: rgba(0,0,0,.08);
  --accent: #2563eb;
  --text: #0f172a;
  --muted: #64748b;
  --green: #16a34a;
  --green-bg: rgba(22,163,74,.08);
  --amber: #d97706;
  --amber-bg: rgba(217,119,6,.08);
  --radius: 20px;
  --fs: 1;
}
html, body {
  height: 100%; width: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'SukhumvitSet', 'Sarabun', 'Noto Sans Thai', system-ui, sans-serif;
  font-weight: 700;
  overflow: hidden;
}

.screen { position: fixed; inset: 0; transition: opacity .35s; }
.screen.hidden { opacity: 0; pointer-events: none; }

/* ── PICKER ── */
#picker {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px; background: var(--bg);
}
.picker-fp-logo { height: clamp(60px, 12vw, 160px); object-fit: contain; }
.picker-title { font-size: clamp(18px, 2.2vw, 28px); font-weight: 800; color: var(--text); }
.picker-sub { font-size: clamp(13px, 1.3vw, 17px); color: var(--muted); }
.picker-list { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 600px; }
.picker-btn {
  padding: 14px 36px;
  border-radius: 14px; border: 2px solid var(--accent);
  background: none; color: var(--accent);
  font-family: inherit; font-size: clamp(15px, 1.8vw, 22px); font-weight: 700;
  cursor: pointer; transition: background .15s, color .15s;
}
.picker-btn:hover { background: var(--accent); color: #fff; }
.picker-wait { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: clamp(13px, 1.3vw, 17px); }
.picker-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); animation: pulse 2s ease-in-out infinite;
}

/* ── IDLE ── */
#idle {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 28px; background: var(--bg);
}
.idle-logo { height: clamp(100px, 22vw, 300px); object-fit: contain; position: relative; z-index: 1; }
.idle-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); animation: pulse 2s ease-in-out infinite;
  position: relative; z-index: 1;
}
@keyframes pulse {
  0%,100% { opacity:.3; transform:scale(.8); }
  50%      { opacity:1;  transform:scale(1.2); }
}

/* ── SLIDESHOW ── */
#idleSlide {
  position: absolute; inset: 0; z-index: 0; overflow: hidden;
}
#idleSlide.empty { display: none; }
.slide-img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover;
  object-position: top center;
  opacity: 0;
}
.slide-img.visible { opacity: 1; }

/* Ken Burns variants */
@keyframes kb-1 { 0%{transform:scale(1)    translate(0,0);    }100%{transform:scale(1.18)translate(-3%,-2%);} }
@keyframes kb-2 { 0%{transform:scale(1.15) translate(-3%,-2%);}100%{transform:scale(1)    translate(3%, 2%); } }
@keyframes kb-3 { 0%{transform:scale(1)    translate(3%, 0);  }100%{transform:scale(1.18)translate(-2%, 2%);} }
@keyframes kb-4 { 0%{transform:scale(1.12) translate(2%, 2%); }100%{transform:scale(1)    translate(-3%,-2%);} }

/* ── ACTIVE ── */
#active {
  display: flex; flex-direction: column;
  padding: 36px 48px 32px;
  gap: 24px; background: var(--bg);
  overflow: hidden;
}
.topbar { display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.topbar-store-logo { height: clamp(28px, 3.5vw, 52px); object-fit: contain; }
.topbar-right { display: flex; align-items: center; gap: 12px; }

.order-chip {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 999px; padding: 8px 20px;
}
.order-chip-label { font-size: clamp(11px,1.2vw,14px); color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.order-chip-code {
  font-family: 'SF Mono','Fira Code',monospace;
  font-size: clamp(14px,1.6vw,20px); font-weight: 700; color: var(--text); letter-spacing: .06em;
}
.status-badge {
  display: flex; align-items: center; gap: 8px;
  border-radius: 999px; padding: 8px 18px;
  font-size: clamp(12px,1.3vw,16px); font-weight: 700;
}
.status-badge.paid    { background: var(--green-bg); color: var(--green); }
.status-badge.pending { background: var(--amber-bg); color: var(--amber); }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }

.name-wrap { flex: 0 0 auto; line-height: 1; }
.name-label { font-size: clamp(11px,1.1vw,14px); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 8px; }
.name-text {
  font-size: calc(clamp(36px,7.5vw,100px) * var(--fs)); font-weight: 900;
  letter-spacing: -.02em; color: var(--text);
  word-break: break-word; line-height: 1.05;
}
.name-text.typing::after {
  content: '|'; color: var(--accent);
  animation: blink .9s step-end infinite; margin-left: 2px;
}
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

.divider { flex-shrink: 0; height: 1px; background: var(--border); }

.items-wrap { flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; }
.items-label { font-size: clamp(11px,1.1vw,14px); color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-bottom: 10px; flex-shrink: 0; }
.items-list { flex: 1 1 auto; overflow: hidden; display: flex; flex-direction: column; gap: 8px; }
.item-row {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px 20px; flex-shrink: 0;
}
.item-info { display: flex; flex-direction: column; gap: 3px; }
.item-name { font-size: calc(clamp(14px,1.8vw,24px) * var(--fs)); font-weight: 700; color: var(--text); }
.item-meta { font-size: clamp(11px,1.1vw,14px); color: var(--muted); }
.item-price { font-size: calc(clamp(15px,1.9vw,26px) * var(--fs)); font-weight: 800; color: var(--accent); white-space: nowrap; }

.total-bar {
  flex-shrink: 0; display: flex; align-items: center; justify-content: space-between;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px 28px;
}
.total-label { font-size: clamp(14px,1.6vw,22px); font-weight: 600; color: var(--muted); }
.total-amount { font-size: calc(clamp(24px,4vw,56px) * var(--fs)); font-weight: 900; color: var(--green); letter-spacing: -.02em; }

.notice-bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 10px;
  border-radius: 12px; padding: 10px 18px;
  font-size: clamp(11px,1.2vw,15px); color: var(--muted); border: 1px solid var(--border);
}
.notice-icon { color: var(--amber); font-size: 1.1em; }

/* change station btn */
.change-btn {
  position: fixed; bottom: 16px; right: 16px;
  background: none; border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 12px;
  font-family: inherit; font-size: 11px; color: var(--muted);
  cursor: pointer; opacity: .35; transition: opacity .2s; z-index: 10;
}
.change-btn:hover { opacity: 1; }
</style>
</head>
<body>

<!-- PICKER -->
<div id="picker" class="screen">
  <img src="/assets/logo-FP.png" class="picker-fp-logo" alt="Fresher Package" />
  <div class="picker-title">เลือกโต๊ะรับสินค้า</div>
  <div id="pickerContent">
    <div class="picker-wait"><div class="picker-dot"></div><span>กำลังรอพี่เนยเข้าสู่ระบบ...</span></div>
  </div>
</div>

<!-- IDLE -->
<div id="idle" class="screen hidden">
  <img src="/assets/logo-FP.png" class="idle-logo" alt="Fresher Package" />
  <div id="idleSlide" class="empty"></div>
  <div class="idle-dot"></div>
</div>

<!-- ACTIVE -->
<div id="active" class="screen hidden">
  <div class="topbar">
    <img src="/assets/logo-store.png" class="topbar-store-logo" alt="SU Store" />
    <div class="topbar-right">
      <div class="order-chip">
        <span class="order-chip-label">Order</span>
        <span class="order-chip-code" id="dOrderId">—</span>
      </div>
      <div class="status-badge" id="dStatusBadge">
        <div class="status-dot"></div>
        <span id="dStatusText">—</span>
      </div>
    </div>
  </div>

  <div class="name-wrap">
    <div class="name-label">ชื่อลูกค้า</div>
    <div class="name-text" id="dName">—</div>
  </div>

  <div class="divider"></div>

  <div class="items-wrap">
    <div class="items-label">รายการสินค้า</div>
    <div class="items-list" id="dItems"></div>
  </div>

  <div class="total-bar">
    <span class="total-label">ยอดรวม</span>
    <span class="total-amount" id="dTotal">฿0</span>
  </div>

  <div class="notice-bar">
    <span class="notice-icon">&#9432;</span>
    กรุณาตรวจสอบชื่อและรายการสินค้าให้ถูกต้องก่อนรับสินค้า
  </div>
</div>

<button class="change-btn" id="changeBtn" style="display:none" onclick="resetUser()">เปลี่ยนโต๊ะ</button>

<script>
var sPicker = document.getElementById('picker');
var sIdle   = document.getElementById('idle');
var sActive = document.getElementById('active');
var changeBtn = document.getElementById('changeBtn');
var dName    = document.getElementById('dName');
var dOrderId = document.getElementById('dOrderId');
var dStatusText  = document.getElementById('dStatusText');
var dStatusBadge = document.getElementById('dStatusBadge');
var dItems   = document.getElementById('dItems');
var dTotal   = document.getElementById('dTotal');

var STATUS_LABEL = {
  pending_payment:'รอชำระเงิน', waiting_confirm:'รอยืนยัน', paid:'ชำระแล้ว',
  preparing:'กำลังจัดเตรียม', shipped:'พร้อมรับ', received:'รับแล้ว',
  cancelled:'ยกเลิก', rejected:'ถูกปฏิเสธ',
};
var PAID_STATUSES = {paid:1,preparing:1,shipped:1,received:1};

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function baht(n) { return '฿' + Number(n).toLocaleString('th-TH', {maximumFractionDigits:0}); }

function showScreen(s) {
  [sPicker, sIdle, sActive].forEach(function(x){ x.classList.add('hidden'); });
  s.classList.remove('hidden');
  changeBtn.style.display = (s === sPicker) ? 'none' : '';
}

/* ── user selection ── */
var chosenUser = localStorage.getItem('suDisplayUser') || '';
var _timer = null;

function resetUser() {
  chosenUser = '';
  localStorage.removeItem('suDisplayUser');
  clearTimeout(_timer);
  showScreen(sPicker);
  pollUsers();
}

function selectUser(username) {
  chosenUser = username;
  localStorage.setItem('suDisplayUser', username);
  showScreen(sIdle);
  pollState();
}

function pollUsers() {
  fetch('/display1/users', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(users){
      var el = document.getElementById('pickerContent');
      if (!users || !users.length) {
        el.innerHTML = '<div class="picker-wait"><div class="picker-dot"></div><span>กำลังรอพี่เนยเข้าสู่ระบบ...</span></div>';
      } else {
        var html = '<div class="picker-sub" style="margin-bottom:16px">เลือกโต๊ะที่ต้องการแสดงผล</div><div class="picker-list">';
        for (var i = 0; i < users.length; i++) {
          html += '<button class="picker-btn" onclick="selectUser(\'' + esc(users[i]) + '\')">' + esc(users[i]) + '</button>';
        }
        html += '</div>';
        el.innerHTML = html;
      }
    })
    .catch(function(){})
    .finally(function(){ _timer = setTimeout(pollUsers, 2500); });
}

/* ── state polling ── */
var _lastKey = null;
function pollState() {
  if (!chosenUser) return;
  fetch('/display1/state?user=' + encodeURIComponent(chosenUser), {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(s){
      var k = JSON.stringify(s);
      if (k !== _lastKey) { render(s); _lastKey = k; }
    })
    .catch(function(){})
    .finally(function(){ _timer = setTimeout(pollState, 1500); });
}

/* ── slideshow ── */
var _slideTimer = null;
var _slideIdx = 0;
var _slideImages = [];
var _slideType = 'kenburns';
var _KB = ['kb-1','kb-2','kb-3','kb-4'];
/* cached config — survives active→idle transition when active state has no slideImages */
var _cachedSlideImages = [];
var _cachedSlideInterval = 4;
var _cachedSlideTransition = 'kenburns';

function stopSlideshow() {
  clearInterval(_slideTimer); _slideTimer = null;
  var el = document.getElementById('idleSlide');
  if (el) { el.innerHTML = ''; el.className = 'empty'; }
}

function _showSlide(imgs, idx, secs) {
  var img = imgs[idx];
  if (!img) return;
  if (_slideType === 'kenburns') {
    img.style.transition = 'opacity .9s ease';
    img.style.animation = _KB[idx % 4] + ' ' + (secs * 1.15) + 's linear forwards';
  } else if (_slideType === 'slide') {
    img.style.transition = 'opacity .55s ease, transform .7s cubic-bezier(.4,0,.2,1)';
    img.style.transform = 'translateX(0)';
  } else {
    img.style.transition = 'opacity .8s ease';
  }
  img.classList.add('visible');
}

function _hideSlide(imgs, idx) {
  var img = imgs[idx];
  if (!img) return;
  if (_slideType === 'kenburns') {
    img.style.animation = '';
    img.style.transform = '';
  } else if (_slideType === 'slide') {
    img.style.transition = 'opacity .55s ease, transform .7s cubic-bezier(.4,0,.2,1)';
    img.style.transform = 'translateX(-110%)';
  }
  img.classList.remove('visible');
  if (_slideType === 'slide') {
    (function(i){ setTimeout(function(){
      var el = document.getElementById('idleSlide');
      if (!el) return;
      var all = el.querySelectorAll('.slide-img');
      if (all[i]) { all[i].style.transition = 'none'; all[i].style.transform = 'translateX(110%)'; }
    }, 750); })(idx);
  }
}

function startSlideshow(images, interval, transition) {
  stopSlideshow();
  if (!images || !images.length) return;
  _slideImages = images;
  _slideIdx = 0;
  _slideType = transition || 'kenburns';
  var secs = Math.max(1, parseInt(interval) || 4);
  var el = document.getElementById('idleSlide');
  if (!el) return;
  el.className = '';
  var html = '';
  for (var i = 0; i < images.length; i++) {
    var initX = (_slideType === 'slide' && i > 0) ? 'translateX(110%)' : '';
    html += '<img src="' + images[i] + '" class="slide-img" style="' + (initX ? 'transform:' + initX : '') + '" alt="" />';
  }
  el.innerHTML = html;
  var imgs = el.querySelectorAll('.slide-img');
  _showSlide(imgs, 0, secs);
  if (images.length < 2) return;
  _slideTimer = setInterval(function() {
    var el2 = document.getElementById('idleSlide');
    if (!el2) return;
    var all = el2.querySelectorAll('.slide-img');
    var next = (_slideIdx + 1) % all.length;
    _hideSlide(all, _slideIdx);
    _slideIdx = next;
    _showSlide(all, next, secs);
  }, secs * 1000);
}

var _manualFs = 1;
function applyFontSize(s) {
  _manualFs = (s && s.fontSize && s.fontSize >= 50 && s.fontSize <= 200) ? s.fontSize / 100 : 1;
  document.documentElement.style.setProperty('--fs', _manualFs);
}
var _autofitRaf = null;
function autofit() {
  if (sActive.classList.contains('hidden')) return;
  document.documentElement.style.setProperty('--fs', _manualFs);
  if (_autofitRaf) cancelAnimationFrame(_autofitRaf);
  _autofitRaf = requestAnimationFrame(function() {
    var fs = _manualFs;
    var floor = 0.35;
    var step = 0.05;
    var attempts = 0;
    while (attempts < 40 && sActive.scrollHeight > sActive.clientHeight + 2 && fs > floor) {
      fs = Math.max(floor, fs - step);
      document.documentElement.style.setProperty('--fs', fs);
      attempts++;
    }
  });
}
window.addEventListener('resize', function() { autofit(); });

var _slidesFetching = false;
var _slidesFetched = false;
function _prefetchSlides() {
  if (_slidesFetched || _slidesFetching) return;
  _slidesFetching = true;
  fetch('/display1/slides', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      _slidesFetched = true;
      if (d.slides && d.slides.length && !_cachedSlideImages.length) {
        _cachedSlideImages = d.slides.map(function(sl){ return sl.url; });
        startSlideshow(_cachedSlideImages, _cachedSlideInterval, _cachedSlideTransition);
      }
    })
    .catch(function(){})
    .finally(function(){ _slidesFetching = false; });
}

function render(s) {
  applyFontSize(s);
  if (!s || !s.active) {
    showScreen(sIdle);
    if (s && s.slideImages && s.slideImages.length) {
      _cachedSlideImages    = s.slideImages;
      _cachedSlideInterval  = s.slideInterval  || 4;
      _cachedSlideTransition = s.slideTransition || 'kenburns';
    }
    if (_cachedSlideImages.length) {
      startSlideshow(_cachedSlideImages, _cachedSlideInterval, _cachedSlideTransition);
    } else {
      _prefetchSlides();
    }
    return;
  }
  stopSlideshow();
  showScreen(sActive);
  dName.textContent = s.name || '—';
  dName.className = 'name-text' + (s.typing ? ' typing' : '');

  var multi = Array.isArray(s.orders) && s.orders.length > 1;
  var html = '';
  if (multi) {
    dOrderId.textContent = s.orders.length + ' ออเดอร์';
    dStatusText.textContent = 'พิมพ์ใบเสร็จ ' + s.orders.length + ' ใบ';
    dStatusBadge.className = 'status-badge paid';
    var grand = 0;
    for (var oi = 0; oi < s.orders.length; oi++) {
      var od = s.orders[oi];
      var oItems = od.items || [];
      var oSub = 0;
      var orderRows = '';
      for (var ii = 0; ii < oItems.length; ii++) {
        var oit = oItems[ii];
        var oMeta = [];
        if (oit.size) oMeta.push('Size ' + esc(oit.size));
        if (oit.qty)  oMeta.push('&times;' + oit.qty);
        if (oit.school) oMeta.push(esc(oit.school));
        var oPrice = Number(oit.total) || 0;
        oSub += oPrice;
        orderRows += '<div class="item-row" style="padding-left:8px"><div class="item-info">' +
          '<div class="item-name">' + esc(oit.name) + '</div>' +
          (oMeta.length ? '<div class="item-meta">' + oMeta.join(' &middot; ') + '</div>' : '') +
          '</div><div class="item-price">' + baht(oPrice) + '</div></div>';
      }
      grand += Number(od.total) || oSub;
      html += '<div class="order-group" style="border-top:1px solid rgba(255,255,255,.08);padding:8px 0 4px">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;padding:0 4px 4px">' +
          '<div style="font-weight:700;font-size:clamp(14px,1.4vw,20px);letter-spacing:.03em">' + esc(od.orderId || '—') + '</div>' +
          '<div style="font-weight:700;color:var(--muted);font-size:clamp(12px,1.2vw,16px)">' + baht(Number(od.total) || oSub) + '</div>' +
        '</div>' + orderRows + '</div>';
    }
    dItems.innerHTML = html;
    dTotal.textContent = baht(Number(s.total) || grand);
  } else {
    dOrderId.textContent = s.orderId || '—';
    dStatusText.textContent = STATUS_LABEL[s.status] || s.status || '—';
    dStatusBadge.className = 'status-badge ' + (PAID_STATUSES[s.status] ? 'paid' : 'pending');
    var items = s.items || [];
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      var meta = [];
      if (it.size) meta.push('Size ' + esc(it.size));
      if (it.qty)  meta.push('&times;' + it.qty);
      if (it.school) meta.push(esc(it.school));
      html += '<div class="item-row"><div class="item-info">' +
        '<div class="item-name">' + esc(it.name) + '</div>' +
        (meta.length ? '<div class="item-meta">' + meta.join(' &middot; ') + '</div>' : '') +
        '</div><div class="item-price">' + baht(it.total) + '</div></div>';
    }
    dItems.innerHTML = html;
    dTotal.textContent = baht(s.total || 0);
  }
  autofit();
}

/* ── init ── */
if (chosenUser) {
  showScreen(sIdle);
  pollState();
} else {
  showScreen(sPicker);
  pollUsers();
}
</script>
</body>
</html>
