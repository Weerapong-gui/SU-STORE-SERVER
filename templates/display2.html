<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SU STORE — Display2</title>
<style>
@font-face {
  font-family: 'SukhumvitSet';
  src: url('/fonts/SukhumvitSet.ttc') format('truetype');
  font-weight: 100 900;
  font-display: swap;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0b1220;
  --surface: #131b2e;
  --surface-2: #1a2540;
  --border: rgba(255,255,255,.08);
  --accent: #4f6ef7;
  --accent-bg: rgba(79,110,247,.12);
  --text: #f1f5f9;
  --muted: #94a3b8;
  --green: #16a34a;
  --red: #dc2626;
  --amber: #d97706;
  --radius: 16px;
}
html, body {
  height: 100%; width: 100%;
  background: var(--bg); color: var(--text);
  font-family: 'SukhumvitSet','Sarabun','Noto Sans Thai',system-ui,sans-serif;
  font-weight: 700;
}
.screen { position: fixed; inset: 0; display: none; flex-direction: column; }
.screen.active { display: flex; }
.center { align-items: center; justify-content: center; gap: 24px; }

#loginCard {
  background: var(--surface); padding: 28px; border-radius: var(--radius);
  width: min(380px, 90vw); display: flex; flex-direction: column; gap: 14px;
  border: 1px solid var(--border);
}
#loginCard h2 { font-size: 22px; font-weight: 800; }
#loginCard input {
  padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); font-size: 16px;
  font-family: inherit;
}
#loginCard button {
  padding: 14px; border-radius: 10px; border: none; background: var(--accent);
  color: #fff; font-weight: 700; font-size: 16px; cursor: pointer;
}
#loginCard button:disabled { opacity: .5; cursor: not-allowed; }
.err { color: var(--red); font-size: 14px; min-height: 18px; }

#picker .picker-title { font-size: clamp(24px, 3vw, 36px); font-weight: 800; }
.picker-grid { display: flex; gap: 22px; flex-wrap: wrap; justify-content: center; }
.picker-card {
  width: 220px; height: 220px; border-radius: 20px;
  background: var(--surface); border: 2px solid var(--border);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; cursor: pointer; transition: transform .12s, border-color .12s;
}
.picker-card:hover { transform: translateY(-3px); border-color: var(--accent); }
.picker-card img { width: 110px; height: 110px; object-fit: contain; }
.picker-card .label { font-size: 20px; font-weight: 800; }
#picker .footer-row { display: flex; gap: 14px; }
.btn-ghost {
  padding: 10px 18px; border-radius: 10px; border: 1px solid var(--border);
  background: transparent; color: var(--muted); cursor: pointer; font-family: inherit;
}
.btn-ghost:hover { color: var(--text); border-color: var(--accent); }

#queue { background: var(--bg); padding: 0; }
.q-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 24px; background: var(--surface); border-bottom: 1px solid var(--border);
}
.q-title-row { display: flex; align-items: baseline; gap: 14px; }
.q-title { font-size: clamp(22px, 2.4vw, 32px); font-weight: 800; letter-spacing: .04em; }
.q-counter {
  background: var(--accent-bg); color: var(--accent);
  padding: 4px 14px; border-radius: 999px; font-weight: 800; font-size: 18px;
}
#qCounter { font-size: 26px; padding: 6px 18px; box-shadow: 0 0 0 2px rgba(79,110,247,.25); }
.q-counter-label { color: var(--muted); font-size: 13px; font-weight: 600; }
.q-title-row .q-counter-label { font-size: 15px; font-weight: 700; color: var(--text); opacity: .8; }
.q-meta { display: flex; align-items: center; gap: 12px; color: var(--muted); }
.q-banner {
  display: none; padding: 10px 24px; background: rgba(220,38,38,.15);
  color: #fecaca; font-weight: 600; text-align: center;
}
.q-banner.active { display: block; }
.q-list {
  flex: 1; overflow-y: auto; padding: 18px 24px;
  display: flex; flex-direction: column; gap: 14px;
}
.q-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 0; display: grid;
  grid-template-columns: auto auto 1fr auto; column-gap: 14px;
  align-items: stretch; overflow: hidden; min-height: 132px;
}
.q-card > .q-thumb { border-radius: 0; align-self: stretch; }
.q-card > .q-boxes { display: flex; gap: 10px; align-items: center; padding: 14px 0 14px 14px; }
.q-card > .q-info { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 14px 0; }
.q-card > .btn-check { align-self: stretch; border-radius: 0; margin: 0; min-width: 160px; font-size: 22px; }
.q-boxes .q-size, .q-boxes .q-qty-box, .q-boxes .q-color-swatch { height: 104px; }
.q-info .nick-row { font-size: clamp(22px, 2.4vw, 30px); font-weight: 800; }
.q-info .meta-row { font-size: clamp(15px, 1.4vw, 18px); color: var(--text); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
.q-info .meta-row .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .85; margin-right: -8px; font-weight: 700; }
.q-info .meta-row .order { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.q-info .meta-row .undone-tag { color: var(--amber); font-weight: 700; }
.q-thumb { width: 132px; height: 100%; border-radius: 0; overflow: hidden; background: var(--surface-2); flex-shrink: 0; display: flex; flex-direction: column; }
.q-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.q-thumb-cap { font-size: 12px; font-weight: 700; color: var(--text); padding: 4px 6px; background: rgba(0,0,0,.4); text-align: center; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q-card.no-size .q-thumb { width: 240px; }
.q-card.no-size .q-thumb img { flex: 1; min-height: 0; object-fit: cover; }
.q-card.no-size .q-thumb-cap { font-size: 13px; padding: 5px 8px; }
.q-card.no-size > .q-boxes { padding-left: 14px; }
.q-card:not(:has(.q-thumb)) { grid-template-columns: auto 1fr auto; }
.q-card.is-new { animation: slideIn .25s ease-out; }
.q-card.undone { border-color: var(--amber); }
@keyframes slideIn { from { opacity: 0; transform: translateY(-8px) } to { opacity: 1; transform: none } }
.q-size {
  font-size: clamp(36px, 5vw, 56px); font-weight: 900; color: var(--accent);
  background: var(--accent-bg); padding: 8px 18px; border-radius: 14px;
  min-width: 96px; min-height: 110px;
  display: flex; align-items: center; justify-content: center;
}
.q-size.q-size-ticket {
  padding: 4px; min-width: 260px; min-height: 110px;
  background: transparent; border: none; overflow: hidden;
}
.q-size.q-size-ticket img { max-width: 100%; max-height: 100%; height: auto; display: block; }
.q-size-group { display: flex; gap: 10px; align-items: stretch; }
.q-color-swatch { width: 96px; min-height: 100%; border-radius: 14px; border: 2px solid rgba(255,255,255,.12); flex-shrink: 0; }
.q-info { display: flex; flex-direction: column; gap: 4px; }
.q-info .nick { font-size: clamp(22px, 2.4vw, 30px); font-weight: 800; }
.q-info .meta { display: none; }
.q-info .order { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.q-info .undone-tag { color: var(--amber); font-weight: 700; }
.q-info .label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; opacity: .8; margin-right: -8px; font-weight: 600; }
.q-qty-box {
  display: inline-flex; flex-direction: column; align-items: stretch; justify-content: flex-end;
  width: 96px; min-height: 110px; border-radius: 14px;
  background: rgba(148,163,184,.22); color: var(--text);
  font-weight: 900; flex-shrink: 0; overflow: hidden; margin-right: 14px; vertical-align: middle;
  text-align: center; line-height: 1;
}
.q-qty-box.warn { background: rgba(217,119,6,.25); color: var(--amber); }
.q-qty-num { font-size: clamp(28px, 3.5vw, 44px); padding: 14px 0 8px; font-weight: 900; }
.q-qty-unit { font-size: 14px; padding: 6px 0; background: rgba(0,0,0,.25); font-weight: 700; }
.q-qty-box.warn .q-qty-unit { background: rgba(217,119,6,.4); color: #fff; }
.q-card.multi { border-color: var(--amber); }
.btn-check {
  padding: 18px 26px; border-radius: 14px; border: none; background: var(--green);
  color: #fff; font-weight: 800; font-size: 18px; cursor: pointer; font-family: inherit;
  min-width: 140px;
}
.btn-check:hover { filter: brightness(1.08); }
.btn-check:disabled { opacity: .5; cursor: not-allowed; }
.btn-check.btn-refund { background: var(--amber); }
.q-amount-badge {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 6px 14px; border-radius: 10px;
  background: rgba(217,119,6,.18); color: var(--amber);
  font-weight: 800; font-size: 22px;
  border: 1px solid rgba(217,119,6,.35);
  margin-left: 4px;
}
.q-card.hb-card .q-amount-badge { font-size: 24px; }
.q-empty {
  display: none; flex: 1; flex-direction: column;
  align-items: center; justify-content: center; gap: 18px;
  color: var(--muted);
}
.q-empty.active { display: flex; }
.q-empty-logo {
  width: 220px; height: 220px;
  background: url('/assets/logo-store.png') center/contain no-repeat;
  opacity: .9;
}
.q-empty-text { font-size: 20px; font-weight: 600; }
.q-empty-dot {
  width: 12px; height: 12px; border-radius: 50%; background: var(--accent);
  animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100% { opacity:.3; transform:scale(.8) } 50% { opacity:1; transform:scale(1.2) } }

#toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  background: var(--amber); color: #fff; padding: 12px 20px; border-radius: 10px;
  font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.35); z-index: 9999;
  opacity: 0; transition: opacity .2s; pointer-events: none;
}
#toast.show { opacity: 1; }
#undoSnack {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--surface); color: var(--text); padding: 14px 22px; border-radius: 12px;
  font-weight: 700; box-shadow: 0 10px 30px rgba(0,0,0,.45); z-index: 9999;
  display: none; align-items: center; gap: 16px; border: 1px solid var(--border);
}
#undoSnack.show { display: flex; }
#undoSnack .snack-msg { color: var(--muted); font-weight: 600; }
#undoSnack button {
  background: transparent; border: 1px solid var(--amber); color: var(--amber);
  padding: 8px 16px; border-radius: 10px; font-family: inherit; font-weight: 800;
  cursor: pointer; font-size: 14px;
}
#undoSnack button:hover { background: rgba(217,119,6,.12); }
#qTodayCount { background: rgba(22,163,74,.15); color: var(--green); }
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 1000; align-items: center; justify-content: center; padding: 24px; }
.modal.active { display: flex; }
.modal-card {
  background: var(--surface); width: min(720px, 95vw); height: min(80vh, 720px);
  border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden;
  border: 1px solid var(--border);
}
.modal-head { display: flex; justify-content: space-between; align-items: center;
  padding: 16px 20px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 18px; font-weight: 800; }
.modal-search { padding: 12px 20px; border-bottom: 1px solid var(--border); }
.modal-search input {
  width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--text); font-size: 15px; font-family: inherit;
}
.modal-list { flex: 1; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
.modal-empty { padding: 24px; text-align: center; color: var(--muted); display: none; }
.modal-empty.active { display: block; }
.hist-row {
  display: grid; grid-template-columns: auto 1fr auto; gap: 14px;
  background: var(--surface-2); padding: 12px 14px; border-radius: 12px;
  align-items: center;
}
.hist-time { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.hist-main { display: flex; flex-direction: column; gap: 2px; }
.hist-main .h-line1 { font-weight: 700; }
.hist-main .h-line2 { color: var(--muted); font-size: 13px; }
.btn-undo { padding: 8px 14px; border-radius: 10px; border: 1px solid var(--amber);
  background: transparent; color: var(--amber); font-family: inherit; font-weight: 700; cursor: pointer; }
.btn-undo:hover { background: rgba(217,119,6,.12); }
</style>
</head>
<body>

<section id="login" class="screen center">
  <div id="loginCard">
    <h2>SU STORE — Display2</h2>
    <input id="loginUser" type="text" placeholder="username" autocomplete="username">
    <input id="loginPass" type="password" placeholder="password" autocomplete="current-password">
    <div class="err" id="loginErr"></div>
    <button id="loginBtn">เข้าสู่ระบบ</button>
  </div>
</section>

<section id="picker" class="screen center">
  <div class="picker-title">เลือก Station</div>
  <div class="picker-grid">
    <div class="picker-card" data-station="polo">
      <div class="label">POLO</div>
    </div>
    <div class="picker-card" data-station="jacket">
      <div class="label">JACKET</div>
    </div>
    <div class="picker-card" data-station="headband">
      <div class="label">HEADBAND</div>
    </div>
    <div class="picker-card" data-station="khantok">
      <div class="label">KHANTOK</div>
    </div>
  </div>
  <div class="footer-row">
    <button class="btn-ghost" id="logoutBtn">ออกจากระบบ</button>
  </div>
</section>

<section id="queue" class="screen">
  <header class="q-header">
    <div class="q-title-row">
      <span class="q-title" id="qStationLabel">—</span>
      <span class="q-counter-label">รอหยิบ</span>
      <span class="q-counter" id="qCounter">0</span>
    </div>
    <div class="q-meta">
      <span id="qUser">—</span>
      <span class="q-counter-label">หยิบแล้ววันนี้</span>
      <span class="q-counter" id="qTodayCount" title="วันนี้หยิบไปแล้ว">0</span>
      <button class="btn-ghost" id="qFsBtn" aria-label="fullscreen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 9 3 3 9 3"/><polyline points="21 9 21 3 15 3"/>
          <polyline points="3 15 3 21 9 21"/><polyline points="21 15 21 21 15 21"/>
        </svg>
      </button>
      <button class="btn-ghost" id="qHistoryBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:4px"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        ประวัติวันนี้
      </button>
      <button class="btn-ghost" id="qMuteBtn" aria-label="mute">
        <svg id="qMuteIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
          <line x1="23" y1="9" x2="17" y2="15"/>
          <line x1="17" y1="9" x2="23" y2="15"/>
        </svg>
      </button>
      <button class="btn-ghost" id="qLogoutBtn">ออก</button>
    </div>
  </header>
  <div class="q-banner" id="qBanner"></div>
  <main class="q-list" id="qList"></main>
  <div class="q-empty" id="qEmpty">
    <div class="q-empty-logo"></div>
    <div class="q-empty-text">รอออเดอร์...</div>
    <span class="q-empty-dot"></span>
  </div>
</section>

<div id="historyModal" class="modal">
  <div class="modal-card">
    <header class="modal-head">
      <div class="modal-title">ประวัติวันนี้ — <span id="histStation">—</span></div>
      <button class="btn-ghost" id="histCloseBtn">ปิด</button>
    </header>
    <div class="modal-search">
      <input id="histSearch" type="search" placeholder="ค้นหา: รหัสนักศึกษา / ออเดอร์ / ชื่อเล่น">
    </div>
    <main class="modal-list" id="histList"></main>
    <div class="modal-empty" id="histEmpty">ไม่มีรายการวันนี้</div>
  </div>
</div>
<div id="toast"></div>
<div id="undoSnack">
  <span class="snack-msg" id="undoSnackMsg">เช็คแล้ว</span>
  <button id="undoSnackBtn">↺ คืน</button>
</div>

<script>
(function(){
  var TOKEN_KEY = 'display2Token';
  var USER_KEY  = 'display2User';
  var STATION_KEY = 'display2Station';

  function $(id){ return document.getElementById(id); }
  function show(id){
    ['login','picker','queue'].forEach(function(s){
      $(s).classList.toggle('active', s === id);
    });
  }

  function getToken(){ return sessionStorage.getItem(TOKEN_KEY) || ''; }
  function getUser(){ return sessionStorage.getItem(USER_KEY) || ''; }
  function getStation(){ return sessionStorage.getItem(STATION_KEY) || ''; }
  function setAuth(tok, user){
    sessionStorage.setItem(TOKEN_KEY, tok);
    sessionStorage.setItem(USER_KEY, user);
  }
  function clearAll(){
    sessionStorage.removeItem(TOKEN_KEY);
    sessionStorage.removeItem(USER_KEY);
    sessionStorage.removeItem(STATION_KEY);
  }

  var MUTE_KEY = 'display2Mute';
  var audioCtx = null;

  function isMuted(){ return localStorage.getItem(MUTE_KEY) === '1'; }
  function setMuted(m){
    if (m) localStorage.setItem(MUTE_KEY, '1'); else localStorage.removeItem(MUTE_KEY);
    updateMuteIcon();
  }
  function updateMuteIcon(){
    var icon = $('qMuteIcon');
    if (!icon) return;
    icon.innerHTML = isMuted()
      ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>'
      : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>';
  }
  function chime(){
    if (isMuted() || !audioCtx) return;
    var t = audioCtx.currentTime;
    var osc = audioCtx.createOscillator();
    var gain = audioCtx.createGain();
    osc.connect(gain).connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(440, t + 0.18);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
    osc.start(t); osc.stop(t + 0.3);
  }
  function unlockAudio(){
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
    }
  }

  function authHeaders(){ return { 'Authorization': 'Claim ' + getToken() }; }

  var assetsCache = { polo: [], jacket: {}, khantok: [], headband: {} };
  var assetsLastFetch = 0;
  function loadAssets(force){
    var now = Date.now();
    if (!force && (now - assetsLastFetch) < 30000) return Promise.resolve();
    assetsLastFetch = now;
    return fetch('/display2/admin/assets', { headers: authHeaders() })
      .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function(j){ assetsCache = j || assetsCache; })
      .catch(function(){});
  }
  function orderTint(code){
    if (!code) return 'var(--surface)';
    var h = 0;
    for (var i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) | 0;
    var hue = Math.abs(h) % 360;
    return 'hsla(' + hue + ', 55%, 50%, 0.10)';
  }

  function pickAssetUrl(it){
    if (!it) return '';
    var station = (getStation() || '').toLowerCase();
    var bucket = [];
    if (station === 'polo' || station === 'khantok') {
      bucket = assetsCache[station] || [];
    } else if (station === 'jacket') {
      var byColor = assetsCache.jacket || {};
      var color = '';
      var sizeStr = it.size || '';
      var parts = sizeStr.split('/');
      if (parts.length > 1) color = parts[parts.length - 1].trim();
      bucket = (color && byColor[color]) || byColor[''] || [];
    } else if (station === 'headband') {
      var byCat = assetsCache.headband || {};
      var school = it.school || '';
      bucket = (school && byCat[school]) || byCat[''] || [];
    }
    if (!bucket.length) return '';
    var idx = Math.floor(Math.random() * bucket.length);
    return bucket[idx] && bucket[idx].url || '';
  }
  window.__display2 = { authHeaders: authHeaders, getStation: getStation, getUser: getUser };

  $('loginBtn').addEventListener('click', doLogin);
  $('loginPass').addEventListener('keydown', function(e){ if (e.key === 'Enter') doLogin(); });

  function doLogin(){
    var u = $('loginUser').value.trim();
    var p = $('loginPass').value;
    var btn = $('loginBtn');
    var err = $('loginErr');
    err.textContent = '';
    if (!u || !p) { err.textContent = 'กรอก username และ password'; return; }
    btn.disabled = true;
    fetch('/claim-station/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p }),
    }).then(function(r){
      if (!r.ok) throw new Error('login_failed');
      return r.json();
    }).then(function(j){
      setAuth(j.token, j.username);
      $('loginPass').value = '';
      goAfterLogin();
    }).catch(function(){
      err.textContent = 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';
    }).finally(function(){ btn.disabled = false; });
  }

  document.querySelectorAll('.picker-card').forEach(function(card){
    card.addEventListener('click', function(){
      sessionStorage.setItem(STATION_KEY, card.dataset.station);
      unlockAudio();
      enterQueue();
    });
  });
  $('logoutBtn').addEventListener('click', function(){ clearAll(); show('login'); });

  function goAfterLogin(){ if (getStation()) enterQueue(); else show('picker'); }

  var pollTimer = null;
  var pollDelay = 2000;
  var lastIds = new Set();
  var lastSig = '';

  function toast(msg, kind){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.style.background = kind === 'err' ? 'var(--red)' : 'var(--amber)';
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2500);
  }

  function setBanner(msg){
    var b = $('qBanner');
    if (msg) { b.textContent = msg; b.classList.add('active'); }
    else { b.textContent = ''; b.classList.remove('active'); }
  }

  function escapeHtml(s){
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function renderCard(it, isNew){
    var undone = it.undone
      ? '<span class="undone-tag"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg> undo</span>'
      : '';
    var qty = it.quantity || 1;
    var qtyStation = (getStation() || '').toLowerCase();
    var qtyUnit = (qtyStation === 'headband') ? 'อัน' : (qtyStation === 'khantok') ? 'ใบ' : 'ตัว';
    var qtyHtml = '<span class="q-qty-box' + (qty > 1 ? ' warn' : '') + '">' +
                    '<span class="q-qty-num">' + qty + '</span>' +
                    '<span class="q-qty-unit">' + qtyUnit + '</span>' +
                  '</span>';
    var imgUrl = pickAssetUrl(it);
    var station = (getStation() || '').toLowerCase();
    var hideSize = (station === 'headband');
    var capText = hideSize ? (it.school || '') : '';
    var capHtml = capText ? '<div class="q-thumb-cap">' + escapeHtml(capText) + '</div>' : '';
    var thumbHtml = imgUrl
      ? '<div class="q-thumb"><img src="' + escapeHtml(imgUrl) + '" alt="" loading="lazy"/>' + capHtml + '</div>'
      : (capText ? '<div class="q-thumb">' + capHtml + '</div>' : '');
    var sizeHtml = '';
    if (!hideSize) {
      if (station === 'jacket') {
        var sz = (it.size || '');
        var parts = sz.split('/');
        var sizeLabel = (parts[0] || '').trim() || '-';
        var colorPart = parts.length > 1 ? parts[parts.length - 1].trim().toLowerCase() : '';
        var JACKET_COLOR_MAP = { 'red':'#c1272d', 'blue':'#1d3a8a', 'white':'#e9eaee' };
        var bg = JACKET_COLOR_MAP[colorPart] || 'var(--accent-bg)';
        sizeHtml = '<div class="q-size-group">' +
                     '<div class="q-size">' + escapeHtml(sizeLabel) + '</div>' +
                     '<div class="q-color-swatch" style="background:' + bg + '" title="' + escapeHtml(colorPart) + '"></div>' +
                   '</div>';
      } else if (station === 'khantok') {
        var kSize = String(it.size || '');
        var kAmt = kSize.replace(/[^0-9]/g, '');
        var kImg = '';
        if (kAmt === '100') kImg = '/assets/khantok-ticket-100.png';
        else if (kAmt === '50') kImg = '/assets/khantok-ticket-50.png';
        if (kImg) {
          sizeHtml = '<div class="q-size q-size-ticket"><img src="' + kImg + '" alt="ticket ' + escapeHtml(kAmt) + '" /></div>';
        } else {
          sizeHtml = '<div class="q-size">' + escapeHtml(kSize || '-') + '</div>';
        }
      } else {
        sizeHtml = '<div class="q-size">' + escapeHtml(it.size || '-') + '</div>';
      }
    }
    var tint = orderTint(it.orderCode || '');
    var isHeadband = (station === 'headband');
    var amountHtml = '';
    if (isHeadband) {
      var amt = Number(it.lineTotal) || 0;
      if (amt > 0) {
        amountHtml = '<span class="q-amount-badge">฿' + amt.toLocaleString('th-TH') + '</span>';
      }
    }
    var btnLabel = isHeadband ? 'คืนเงิน' : 'เช็ค';
    var btnIcon = isHeadband
      ? '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:6px"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>'
      : '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-4px;margin-right:6px"><polyline points="20 6 9 17 4 12"/></svg>';
    var btnClass = isHeadband ? 'btn-check btn-refund' : 'btn-check';
    return '' +
      '<div class="q-card' + (it.undone ? ' undone' : '') + (isNew ? ' is-new' : '') + (qty > 1 ? ' multi' : '') + (hideSize ? ' no-size' : '') + (isHeadband ? ' hb-card' : '') + '" data-id="' + it.id + '" style="background:' + tint + '">' +
        thumbHtml +
        '<div class="q-boxes">' + sizeHtml + qtyHtml + amountHtml + '</div>' +
        '<div class="q-info">' +
          '<div class="nick-row">' + escapeHtml(it.fullName || it.nickname || '-') + '</div>' +
          '<div class="meta-row">' +
            '<span class="label">ออเดอร์</span><span class="order">' + escapeHtml(it.orderCode) + '</span>' +
            '<span class="label">รหัส นศ</span><span>' + escapeHtml(it.studentCode || '-') + '</span>' +
            undone +
          '</div>' +
        '</div>' +
        '<button class="' + btnClass + '" data-id="' + it.id + '">' +
          btnIcon +
          btnLabel +
        '</button>' +
      '</div>';
  }

  function renderQueue(items){
    var list = $('qList');
    var empty = $('qEmpty');
    $('qCounter').textContent = items.length;
    if (!items.length) {
      list.innerHTML = '';
      empty.classList.add('active');
      lastIds = new Set();
      lastSig = '';
      return;
    }
    empty.classList.remove('active');
    var newIds = new Set(items.map(function(i){ return i.id; }));
    var sig = items.map(function(i){ return i.id + ':' + (i.undone ? '1' : '0'); }).join('|');
    if (sig === lastSig) { lastIds = newIds; return; }
    var html = items.map(function(i){ return renderCard(i, !lastIds.has(i.id)); }).join('');
    list.innerHTML = html;
    list.querySelectorAll('.btn-check').forEach(function(btn){
      btn.addEventListener('click', onCheck);
    });
    var anyNew = items.some(function(i){ return !lastIds.has(i.id); });
    if (anyNew && lastIds.size > 0) chime();
    lastIds = newIds;
    lastSig = sig;
  }

  function poll(){
    var station = getStation();
    if (!station) { show('picker'); return; }
    fetch('/display2/queue?station=' + encodeURIComponent(station), { headers: authHeaders() })
      .then(function(r){
        if (r.status === 401) { clearAll(); show('login'); throw new Error('auth'); }
        if (!r.ok) throw new Error('http_' + r.status);
        return r.json();
      })
      .then(function(j){
        setBanner('');
        pollDelay = 2000;
        $('qTodayCount').textContent = (j.todayPicked != null ? j.todayPicked : 0);
        loadAssets(false);
        renderQueue(j.items || []);
      })
      .catch(function(e){
        if (e.message === 'auth') return;
        setBanner('ขาดการเชื่อมต่อ — กำลังลองใหม่');
        pollDelay = Math.min(pollDelay * 2, 8000);
      })
      .finally(function(){
        pollTimer = setTimeout(poll, pollDelay);
      });
  }

  function stopPoll(){ if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } }

  function onCheck(e){
    var btn = e.currentTarget;
    var id = parseInt(btn.dataset.id, 10);
    if (!id || btn.disabled) return;
    btn.disabled = true;
    fetch('/display2/pick', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ pick_id: id }),
    }).then(function(r){
      if (r.status === 401) { clearAll(); show('login'); return null; }
      if (r.status === 409) return r.json().then(function(j){ throw { conflict: true, j: j }; });
      if (!r.ok) throw new Error('http_' + r.status);
      return r.json();
    }).then(function(j){
      if (j && j.ok) { showUndoSnack(id); stopPoll(); poll(); }
    }).catch(function(err){
      if (err && err.conflict) {
        toast('หยิบไปแล้วโดย ' + (err.j.pickedBy || '?'), 'warn');
        stopPoll(); poll();
      } else {
        toast('เกิดข้อผิดพลาด', 'err');
        btn.disabled = false;
      }
    });
  }

  $('qLogoutBtn').addEventListener('click', function(){
    stopPoll(); clearAll(); show('login');
  });
  $('qMuteBtn').addEventListener('click', function(){ setMuted(!isMuted()); });
  $('qFsBtn').addEventListener('click', function(){
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(function(){});
  });

  var undoSnackTimer = null;
  var undoSnackId = null;
  function showUndoSnack(id){
    undoSnackId = id;
    var s = $('undoSnack');
    s.classList.add('show');
    clearTimeout(undoSnackTimer);
    undoSnackTimer = setTimeout(hideUndoSnack, 5000);
  }
  function hideUndoSnack(){
    $('undoSnack').classList.remove('show');
    undoSnackId = null;
    clearTimeout(undoSnackTimer);
  }
  $('undoSnackBtn').addEventListener('click', function(){
    var id = undoSnackId;
    hideUndoSnack();
    if (!id) return;
    fetch('/display2/undo', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ pick_id: id }),
    }).then(function(r){
      if (r.status === 422) { toast('เกินเวลา undo (1 ชม)', 'warn'); return null; }
      if (!r.ok) throw new Error('http_' + r.status);
      return r.json();
    }).then(function(j){
      if (j && j.ok) { toast('คืนเข้าคิวแล้ว', 'warn'); stopPoll(); poll(); }
    }).catch(function(){ toast('เกิดข้อผิดพลาด', 'err'); });
  });

  var histDebounce = null;

  $('qHistoryBtn').addEventListener('click', openHistory);
  $('histCloseBtn').addEventListener('click', closeHistory);
  $('historyModal').addEventListener('click', function(e){
    if (e.target === $('historyModal')) closeHistory();
  });
  $('histSearch').addEventListener('input', function(){
    clearTimeout(histDebounce);
    histDebounce = setTimeout(loadHistory, 250);
  });

  function openHistory(){
    $('histStation').textContent = (getStation() || '').toUpperCase();
    $('histSearch').value = '';
    $('historyModal').classList.add('active');
    loadHistory();
  }
  function closeHistory(){ $('historyModal').classList.remove('active'); }

  function loadHistory(){
    var station = getStation();
    var q = $('histSearch').value.trim();
    fetch('/display2/history?station=' + encodeURIComponent(station)
            + '&q=' + encodeURIComponent(q),
          { headers: authHeaders() })
      .then(function(r){ if (!r.ok) throw new Error('http'); return r.json(); })
      .then(function(j){ renderHistory(j.items || []); })
      .catch(function(){ renderHistory([]); });
  }

  function renderHistory(items){
    var list = $('histList');
    var empty = $('histEmpty');
    if (!items.length) { list.innerHTML = ''; empty.classList.add('active'); return; }
    empty.classList.remove('active');
    list.innerHTML = items.map(renderHistRow).join('');
    list.querySelectorAll('.btn-undo').forEach(function(btn){
      btn.addEventListener('click', onUndo);
    });
  }

  function renderHistRow(it){
    var t = (it.pickedAt || '').slice(11, 16);
    var allowUndo = false;
    if (it.pickedAt) {
      var pickedMs = new Date(it.pickedAt).getTime();
      allowUndo = (Date.now() - pickedMs) < 60 * 60 * 1000;
    }
    var undoBtn = allowUndo
      ? '<button class="btn-undo" data-id="' + it.id + '">undo</button>'
      : '<span></span>';
    return '' +
      '<div class="hist-row">' +
        '<div class="hist-time">' + escapeHtml(t) + '</div>' +
        '<div class="hist-main">' +
          '<div class="h-line1">' + escapeHtml(it.nickname || '-') + ' · ' + escapeHtml(it.size || '-') + '</div>' +
          '<div class="h-line2">' + escapeHtml(it.orderCode) + ' · รหัส ' + escapeHtml(it.studentCode || '-') +
            ' · by ' + escapeHtml(it.pickedBy || '-') +
            (it.undone ? ' · (undone)' : '') + '</div>' +
        '</div>' +
        undoBtn +
      '</div>';
  }

  function onUndo(e){
    var id = parseInt(e.currentTarget.dataset.id, 10);
    if (!id) return;
    fetch('/display2/undo', {
      method: 'POST',
      headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
      body: JSON.stringify({ pick_id: id }),
    }).then(function(r){
      if (r.status === 422) { toast('เกินเวลา undo (1 ชม)', 'warn'); return null; }
      if (!r.ok) throw new Error('http_' + r.status);
      return r.json();
    }).then(function(j){
      if (j && j.ok) {
        toast('คืนเข้าคิวแล้ว', 'warn');
        loadHistory();
        stopPoll(); poll();
      }
    }).catch(function(){ toast('เกิดข้อผิดพลาด', 'err'); });
  }

  function enterQueue(){
    show('queue');
    $('qStationLabel').textContent = (getStation() || '').toUpperCase() + ' STATION';
    $('qUser').textContent = getUser();
    stopPoll();
    loadAssets(true).finally(function(){ poll(); });
    updateMuteIcon();
  }

  if (getToken()) goAfterLogin(); else show('login');
})();
</script>
</body>
</html>
